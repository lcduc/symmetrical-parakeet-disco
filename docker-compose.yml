services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    ports:
      - "${POSTGRES_PORT:-5434}:5432"
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-hr_cv_matcher}
      POSTGRES_USER: ${POSTGRES_USER:-hr_cv_matcher}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-hr_cv_matcher}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-hr_cv_matcher} -d ${POSTGRES_DB:-hr_cv_matcher}"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build: .
    restart: unless-stopped
    ports:
      - "${API_PORT:-8002}:8000"
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - path: .env
        required: false
    environment:
      # Overrides whatever POSTGRES_DSN is in .env (that value is for host-side
      # access, e.g. localhost:5434) so the API always reaches Postgres via the
      # compose network regardless of local-dev settings.
      POSTGRES_DSN: postgresql+asyncpg://${POSTGRES_USER:-hr_cv_matcher}:${POSTGRES_PASSWORD:-hr_cv_matcher}@postgres:5432/${POSTGRES_DB:-hr_cv_matcher}
    command: sh -c "alembic upgrade head && uvicorn main:app --host 0.0.0.0 --port 8000"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/health')\""]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  frontend:
    build: .
    restart: unless-stopped
    ports:
      - "${STREAMLIT_PORT:-8501}:8501"
    depends_on:
      - api
    env_file:
      - path: .env
        required: false
    environment:
      # Container-network hostname for the api service, overriding any
      # localhost-based API_BASE_URL meant for local (non-Docker) dev use.
      API_BASE_URL: http://api:8000
    command: streamlit run app/streamlit.py --server.port 8501 --server.address 0.0.0.0

volumes:
  postgres_data:
